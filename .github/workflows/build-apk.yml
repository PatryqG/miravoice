name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Utwórz projekt Androida
        run: flutter create --platforms=android --org pl.miravoice --project-name miravoice .

      - name: Dodaj uprawnienie INTERNET i nazwę aplikacji
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' $M
          sed -i 's|android:label="miravoice"|android:label="MiraVoice"|' $M
          grep INTERNET $M

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MiraVoice-apk
          path: build/app/outputs/flutter-apk/app-release.apk
