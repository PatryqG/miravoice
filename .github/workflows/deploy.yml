name: Wdróż MiraVoice na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Kontrola typów
        run: npx tsc --noEmit

      - name: Zbuduj aplikację
        run: npm run build

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Wyślij artefakt strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
