name: Kontrola bezpieczeństwa i build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typy, build i skan sekretów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kontrola typów
        run: npx tsc --noEmit

      - name: Build produkcyjny
        run: npm run build

      - name: Sprawdź, czy w źródłach nie ma jawnych danych logowania
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist \
            -E "ADMIN_PASSWORD[[:space:]]*=[[:space:]]*[\"'][^\"']{4,}[\"']" src; then
            echo "Znaleziono potencjalne jawne hasło w źródłach."
            exit 1
          fi
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist \
            -E "MiraVoice#[0-9]{4}" .; then
            echo "Znaleziono stary jawny sekret."
            exit 1
          fi
          echo "Brak jawnych danych logowania w źródłach."
